<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WaveCraft — Interactive Drum Sequencer & Sound Design Lab</title>
  <link rel="stylesheet" href="3_style/style.css" />
</head>
<body>
  <header class="top-bar">
    <div class="brand">
      <h1>🎛️ WaveCraft</h1>
      <span class="subtitle">Drum Sequencer &amp; Sound Design Lab</span>
    </div>

    <div class="transport-controls">
      <button id="play-btn" class="btn btn-primary" data-tip="Start or stop the 16-step loop.">▶ Play</button>
      <label class="control-group" data-tip="Beats Per Minute: controls how fast the loop plays.">
        <span>BPM</span>
        <input type="number" id="bpm-input" value="120" min="60" max="200" />
      </label>
      <label class="control-group" data-tip="Load a built-in drum pattern and synth sound.">
        <span>Preset</span>
        <select id="preset-select"></select>
      </label>
    </div>
  </header>

  <main class="workspace">
    <!-- Learn Mode Banner -->
    <section class="learn-banner" aria-live="polite">
      <span class="badge">LEARN MODE</span>
      <p id="learn-text">Hover over any control to see how it shapes the sound.</p>
    </section>

    <!-- Top Row: Synthesizer & Oscilloscope -->
    <section class="grid-two">
      <div class="panel">
        <h2>🌊 Wave Synthesizer</h2>
        <div class="synth-controls">
          <label class="control-group" data-tip="Selects the basic shape of the sound wave. Sine is smooth; Sawtooth and Square are bright and buzzy.">
            <span>Waveform</span>
            <select id="wave-select">
              <option value="sine">Sine (Smooth)</option>
              <option value="triangle">Triangle (Warm)</option>
              <option value="sawtooth">Sawtooth (Bright)</option>
              <option value="square">Square (Hollow)</option>
            </select>
          </label>

          <label class="control-group" data-tip="Low-pass filter cutoff: trims high frequencies to make the sound darker or brighter.">
            <span>Filter Cutoff (<span id="cutoff-val">2000</span> Hz)</span>
            <input type="range" id="cutoff-slider" min="100" max="8000" value="2000" />
          </label>

          <label class="control-group" data-tip="Release time: how long the note takes to fade out after being triggered.">
            <span>Release (<span id="release-val">0.3</span> s)</span>
            <input type="range" id="release-slider" min="0.05" max="1.5" step="0.05" value="0.3" />
          </label>

          <button id="test-synth-btn" class="btn btn-secondary" data-tip="Play a single test note using your current synth settings.">
            🎹 Test Synth Note
          </button>
        </div>
      </div>

      <div class="panel">
        <h2>📈 Live Oscilloscope</h2>
        <canvas id="oscilloscope" width="500" height="160"></canvas>
      </div>
    </section>

    <!-- Bottom Row: 16-Step Drum Sequencer -->
    <section class="panel">
      <div class="panel-header">
        <h2>🥁 16-Step Drum Sequencer</h2>
        <button id="clear-btn" class="btn btn-ghost" data-tip="Turn off all active steps in the grid.">Clear Grid</button>
      </div>
      <p id="sample-status" class="status-note">Using built-in synth drum tones (ready for .wav samples in assets/samples/).</p>
      <div id="sequencer-grid" class="sequencer-grid"></div>
    </section>
  </main>

  <!-- Load data first, then main logic -->
  <script src="1_data/data.js"></script>
  <script src="2_script/script.js"></script>
</body>
</html>
